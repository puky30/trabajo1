<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Mundo Cruel</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #0d1117; /* Fondo oscuro moderno */
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .contenedor {
            text-align: center;
            padding: 30px;
            border: 1px solid #30363d;
            border-radius: 10px;
            background-color: #161b22;
        }
        h1 {
            color: #ff7b72; /* Un tono rojo/coral para el toque "cruel" */
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            color: #8b949e;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>¡Hola Mundo Cruel! 🌎⚡</h1>
        <p>Mi primer archivo HTML estático corriendo con éxito desde Azure.</p>
    </div>
</body>
</html>
